<svg xmlns="http://www.w3.org/2000/svg" width="980" height="260" viewBox="0 0 980 260" role="img" aria-labelledby="title desc">
  <title id="title">GitHub activity breakdown for notatestuser</title>
  <desc id="desc">Two pie charts showing public versus private contributions and readable repository language breakdown.</desc>
  <defs>
    <filter id="softShadow" x="-8%" y="-10%" width="116%" height="122%">
      <feDropShadow dx="0" dy="9" stdDeviation="12" flood-color="rgba(31,35,40,.08)"/>
    </filter>
    <style>
      text { font-family: -apple-system, BlinkMacSystemFont, &quot;Segoe UI&quot;, sans-serif; }
      .title { font-size: 24px; font-weight: 720; letter-spacing: 0; }
      .eyebrow { font-size: 12px; font-weight: 650; letter-spacing: .08em; text-transform: uppercase; }
      .section { font-size: 16px; font-weight: 700; letter-spacing: 0; }
      .body { font-size: 13px; font-weight: 650; letter-spacing: 0; }
      .muted { font-size: 12px; font-weight: 500; letter-spacing: 0; }
      .metric { font-size: 18px; font-weight: 760; letter-spacing: 0; }
      .centerBig { font-size: 22px; font-weight: 780; letter-spacing: 0; }
      .centerSmall { font-size: 11px; font-weight: 650; letter-spacing: .04em; text-transform: uppercase; }
    </style>
  </defs>

  <rect x="38" y="12" width="430" height="230" rx="12" fill="#ffffff" stroke="#d0d7de"/>
  <rect x="512" y="12" width="430" height="230" rx="12" fill="#ffffff" stroke="#d0d7de"/>

  <g transform="translate(0 -76)">
  <text x="62" y="119" class="section" fill="#24292f">Public / private</text>
  <g>
    <path d="M 162 211 L 162.000 139.000 A 72 72 0 0 1 229.375 236.389 Z" fill="#2fb8a6"/>
    <path d="M 162 211 L 229.375 236.389 A 72 72 0 1 1 162.000 139.000 Z" fill="#7c3aed"/>
    <circle cx="162" cy="211" r="42" fill="#ffffff" stroke="#d0d7de"/>
    <text x="162" y="207" text-anchor="middle" class="centerBig" fill="#24292f">13.7k</text>
    <text x="162" y="226" text-anchor="middle" class="centerSmall" fill="#57606a">contribs</text>
  </g>
  
    <g transform="translate(276 170)">
      <rect x="0" y="-10" width="10" height="10" rx="2" fill="#7c3aed"/>
      <text x="18" y="-8" class="body" fill="#24292f">Private</text>
      <text x="18" y="10" class="muted" fill="#57606a">9,474 / 69.3%</text>
    </g>
  
    <g transform="translate(276 222)">
      <rect x="0" y="-10" width="10" height="10" rx="2" fill="#2fb8a6"/>
      <text x="18" y="-8" class="body" fill="#24292f">Public</text>
      <text x="18" y="10" class="muted" fill="#57606a">4,204 / 30.7%</text>
    </g>
  <text x="62" y="296" class="muted" fill="#57606a">Private values are GitHub restricted contribution totals.</text>

  <text x="536" y="119" class="section" fill="#24292f">Language mix</text>
  <g>
    <path d="M 632 211 L 632.000 139.000 A 72 72 0 0 1 681.175 263.591 Z" fill="#f1e05a"/>
    <path d="M 632 211 L 681.175 263.591 A 72 72 0 0 1 603.158 276.971 Z" fill="#3178c6"/>
    <path d="M 632 211 L 603.158 276.971 A 72 72 0 0 1 571.967 250.750 Z" fill="#dea584"/>
    <path d="M 632 211 L 571.967 250.750 A 72 72 0 0 1 560.057 213.852 Z" fill="#00add8"/>
