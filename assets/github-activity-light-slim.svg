      <text x="132" y="0" text-anchor="end" class="muted" fill="#57606a">8.7%</text>
    </g>
    <g transform="translate(780 220)">
      <rect x="0" y="-8" width="9" height="9" rx="2" fill="#636c76"/>
      <text x="17" y="0" class="body" fill="#24292f">C</text>
      <text x="132" y="0" text-anchor="end" class="muted" fill="#57606a">8.2%</text>
    </g>
    <g transform="translate(780 240)">
      <rect x="0" y="-8" width="9" height="9" rx="2" fill="#3572a5"/>
      <text x="17" y="0" class="body" fill="#24292f">Python</text>
      <text x="132" y="0" text-anchor="end" class="muted" fill="#57606a">6.9%</text>
    </g>
    <g transform="translate(780 260)">
