<svg xmlns="http://www.w3.org/2000/svg" width="980" height="225" viewBox="0 0 980 225" role="img" aria-labelledby="title desc">
  <title id="title">GitHub activity breakdown for notatestuser</title>
  <desc id="desc">Two pie charts showing public versus private commits and changed-file language breakdown.</desc>
  <defs>
    <style>
