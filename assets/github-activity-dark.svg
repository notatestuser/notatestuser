<svg xmlns="http://www.w3.org/2000/svg" width="980" height="420" viewBox="0 0 980 420" role="img" aria-labelledby="title desc">
  <title id="title">GitHub activity breakdown for notatestuser</title>
  <desc id="desc">Two pie charts showing public versus private contributions and readable repository language breakdown.</desc>
  <defs>
    <filter id="softShadow" x="-8%" y="-10%" width="116%" height="122%">
