  <text x="760" y="55" class="body" fill="#8b949e">13,678 total</text>
  <text x="760" y="75" class="muted" fill="#8b949e">generated 2026-05-05 SGT</text>

  <text x="62" y="119" class="section" fill="#f0f6fc">Public / private</text>
  <g>
