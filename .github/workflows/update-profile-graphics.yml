name: Update profile graphics

on:
  workflow_dispatch:
  schedule:
    - cron: "17 3 * * 0"

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: lts/*
          check-latest: true

      - name: Restore language cache
        id: language-cache
        uses: actions/cache/restore@v5
        with:
          path: .cache/profile-activity-language-cache.json
          key: profile-language-${{ github.repository_owner }}-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: |
            profile-language-${{ github.repository_owner }}-

      - name: Test generator
        run: npm test

      - name: Update and push graphics
        run: node scripts/update-profile-graphics.mjs --commit --push
        env:
          GITHUB_LOGIN: ${{ github.repository_owner }}
          GH_TOKEN: ${{ secrets.PROFILE_STATS_TOKEN || secrets.GITHUB_TOKEN }}

      - name: Save language cache
        if: always() && hashFiles('.cache/profile-activity-language-cache.json') != ''
        uses: actions/cache/save@v5
        with:
          path: .cache/profile-activity-language-cache.json
          key: ${{ steps.language-cache.outputs.cache-primary-key }}
